[tool.poetry]
name = "mh-rag"
version = "0.1.0"
description = "Multiplex Hypergraph retrieval-augmented generation system."
authors = ["MH-RAG Team"]
readme = "README.md"
packages = [{ include = "mh_rag", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "1.26.4"
scipy = "1.15.2"
scikit-learn = "1.7.2"
hdbscan = "0.8.44"
umap-learn = "0.5.12"
falkordb = "1.6.1"
openai = "2.50.0"
fastapi = "0.141.1"
uvicorn = { extras = ["standard"], version = "0.49.0" }
pydantic = "2.13.4"
pydantic-settings = "2.14.1"
httpx = "0.28.1"
pymupdf = "1.27.2.3"
tiktoken = "0.12.0"
tenacity = "9.1.4"
structlog = "24.4.0"
orjson = "3.11.9"
joblib = "1.5.3"
python-multipart = "0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
ruff = "0.9.9"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "D"]
ignore = ["D203", "D213"]                # one-blank-line-before-class / multi-line-summary conflicts

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]                        # tests do not need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the docker compose stack (deselect with '-m \"not integration\"')",
  "live_llm: makes real Azure OpenAI calls (costs tokens; run explicitly)",
]
addopts = "-m 'not integration and not live_llm'"
